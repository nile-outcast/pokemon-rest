services:
  db:
    image: postgres:16-alpine
    container_name: pokemon-rest-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pokemon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokemon}
      POSTGRES_DB: ${POSTGRES_DB:-pokemon_rest}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pokemon_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pokemon} -d ${POSTGRES_DB:-pokemon_rest}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pokemon_db_data:
